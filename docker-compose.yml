services:
  gateway:
    image: docker-registry.dungeon/compte-database/gateway:$DOCKER_TAG
    restart: always
    ports:
      - $APPLICATION_PORT:80

  backend:
    build: ./backend-express
    volumes:
      - ./backend-express/code:/svc/app
    command: yarn start:dev
    restart: on-failure
    environment:
      - DB_HOST=$DATABASE_HOST
      - DB_PORT=5432
      - DB_USER=$DATABASE_USER
      - DB_PASS=$DATABASE_PASSWORD
      - DB_NAME=$DATABASE_NAME

  backend-transpile:
    build: ./backend-express
    volumes:
      - ./backend-express/code:/svc/app
    command: npx tsc --noEmit --watch
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    image: docker-registry.dungeon/compte-database/frontend:$DOCKER_TAG
    restart: on-failure
    environment:
      API_BASE_URL: $EXTRAITS_API_BASE_URL
      AUTH_SERVER_URL: $AUTH_SERVER_URL
      AUTH_RESOURCE_NAME: $AUTH_RESOURCE_NAME
      AUTH_REALM: $AUTH_REALM
    volumes:
      - ./frontend/code/public/config:/usr/share/nginx/html/config/

  db:
    image: postgres:9.6.8
    restart: on-failure
    volumes:
      - $V_DATABASE:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=$DATABASE_NAME
      - POSTGRES_USER=$DATABASE_USER
      - POSTGRES_PASSWORD=$DATABASE_PASSWORD
      - TZ=Europe/Paris
      - PGTZ=Europe/Paris
